name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: gofmt 格式检查
        run: test -z "$(gofmt -l .)"
      - name: 静态检查
        run: go vet ./...
      - name: 编译
        run: go build ./...
      - name: 单元测试
        run: go test ./...
